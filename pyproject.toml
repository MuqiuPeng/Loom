[project]
name = "loom"
version = "0.1.0"
description = "A personal AI-native automation workflow engine, powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muqiu Peng" }]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "anthropic>=0.18.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
loom = "loom.cli:main"

[project.optional-dependencies]
db = [
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
]
aws = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",
    # str+Enum is load-bearing here: these values are serialised into JSONB,
    # into Notion properties and into the API's JSON, and `str` inheritance is
    # what makes them come out as their value rather than "Model.SONNET".
    # StrEnum would be equivalent on 3.11 but the migration is not free and
    # the current form is correct.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() has to run before the loom modules are imported, because they
# read their configuration at import time. The import block therefore cannot
# sit at the top of the file, and that ordering is the point rather than an
# oversight.
"loom/api.py" = ["E402"]
"loom/storage/postgres.py" = ["E402", "N806"]
# MERGE_RULES is a constant that happens to live inside a function.
"loom/steps/generate_resume.py" = ["N806"]
# Alembic writes these files from its own template, and the template still
# uses typing.Sequence and Union. Rewriting generated boilerplate to satisfy
# a style rule means every new migration starts non-compliant and someone
# hand-edits it — so the template is left alone instead.
"loom/storage/migrations/versions/*.py" = ["UP007", "UP035"]
"loom/storage/migrations/env.py" = ["UP007", "UP035"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
